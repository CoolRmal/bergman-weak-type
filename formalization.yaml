# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: v0.4

project:
  name: Bergman projection weak type constants
  description: >-
    A Lean formalization of weak type (1,1) constants for the Bergman
    projection and its positive-kernel counterpart on the unit disk. The proved
    results are the sharp unweighted constants, weighted positive-kernel constants,
    and upper and lower weighted bounds for the complex projection. A further
    theorem characterizes Euclidean disks among bounded simply connected open
    regions using their reproducing Bergman kernels, without boundary regularity
    assumptions. All seven main comparison targets are proved using only the
    standard permitted Lean axioms.
  authors: [Yongxi Lin]
  responsible_maintainers: [Yongxi Lin]
  license: Apache-2.0

classification:
  arxiv: [math.CV, math.FA]
  msc2020: [30H20, 42B35, 47B38]

related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4/pull/33505
    relationship: adapts
    note: >-
      Ports Yury Kudryashov's Riemann mapping theorem and unit-disk shifts from
      commit d43061d911b1aeae0788591da437a3b115098962 to the pinned Lean and mathlib
      versions as supporting results. Original authorship and Apache-2.0 notices
      are retained.

sources:
  - title: Research notes on sharp and weighted Bergman weak type estimates
    type: original-proof
    relationship: other
    authors: [Yongxi Lin]
    location: docs/weighted-estimates.md
    note: >-
      Unpublished research supplied with the project, summarized in the cited file.
      This records the supplied proof program, not a claim of mathematical novelty
      or independent validation. All seven main targets are proved in Lean.
  - title: Domain rigidity questions for the positive Bergman operator
    type: other
    relationship: other
    authors: [Yongxi Lin]
    location: docs/domain-rigidity.md
    note: >-
      The domain target uses the corrected bounded simply connected scope and
      characterizes arbitrary Euclidean disks. Its kernel is specified by the
      usual holomorphic, square-integrability, symmetry, and reproducing
      properties. Existence, identification, and the full bounded-domain rigidity
      proof are formalized.

status:
  proof_status: complete
  scope: >-
    Both sharp disk constants, the positive weighted constant, and all stated complex
    weighted upper and lower bounds are proved. The domain characterization is also
    proved. The weight range is alpha greater than -1; the additional complex
    boundary lower bound is proved for alpha at least zero. The domain theorem is restricted
    to bounded simply connected open regions, with an actual reproducing Bergman
    kernel and no boundary regularity assumption. The earlier three-result subset passed
    the comparator and independent kernels at commit 061dc8796e789fa4c716c994cbadfce716d4e470.
    No successful full comparator, Palomar mechanical preflight, editorial review,
    or registration is claimed.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  completed_main_results:
    - BergmanWeakType.projection_constant_eq_one
    - BergmanWeakType.positiveProjection_constant_eq_one
    - BergmanWeakType.weightedPositiveProjection_constant_eq
    - BergmanWeakType.one_le_weightedProjection_constant
    - BergmanWeakType.weightedProjection_constant_le
    - BergmanWeakType.boundaryConstant_le_weightedProjection_constant
    - BergmanWeakType.positive_constant_eq_one_iff_disk
  note: >-
    These proof-hole counts exclude the deliberate statement holes in
    Challenge.lean. Main statement completion is recorded separately in the list
    above and checked by the comparator. The axiom list records custom axioms;
    ordinary Lean axioms permitted by comparator.json are listed there.

automation:
  methods:
    - method: agent
      framework: OpenAI Codex
      tool_setup: >-
        AI-assisted statement auditing, Lean development, mathematical source
        analysis, and verification setup, with parallel agent subtasks.
      prompting_notes: >-
        Formalize the specified Bergman results using genuine operator definitions
        and preserve all unresolved mathematical and formal proof obligations.
  notes: >-
    Automated contributions are recorded here. Human responsibility remains with
    the named author and maintainer. Model-specific usage and cost are not tracked.

fidelity:
  divergences: >-
    The domain conclusion concerns arbitrary Euclidean disks, accounting for translation
    and scaling. Its boundedness restriction is required and was explicitly requested.
    The weighted results concern standard radial weights; no arbitrary-weight theorem
    or exact complex weighted constant for general nonzero parameters is asserted.

review:
  status: agent-reviewed
  notes: >-
    Initial source and statement audits led to the bounded simply connected scope
    for the domain characterization. Three main results passed comparator verification
    at the earlier public milestone. No independent mathematical peer review,
    full-project verification, or Palomar review is claimed.
