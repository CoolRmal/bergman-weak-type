name: Lean and comparator checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  development:
    name: Build the proved development
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check source layout and proof holes
        run: |
          python3 scripts/check-lean-sources.py
          python3 scripts/check-proof-holes.py
      - name: Check honest project metadata
        run: ruby scripts/validate-metadata.rb
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Build the proved library
        run: lake build BergmanWeakType

  comparator:
    name: Compare all seven theorems and check independent kernels
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the complete comparison target list
        run: |
          python3 scripts/check-lean-sources.py
          python3 scripts/check-proof-holes.py
          python3 scripts/check-comparator-targets.py
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
      - name: Install the comparator sandbox
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq bubblewrap >/dev/null
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Compare the actual Challenge and Solution
        # A development build alone does not certify statement fidelity or the independent kernels.
        run: ./scripts/verify-comparator.sh
